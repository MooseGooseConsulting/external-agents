name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  discover-agents:
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.discover.outputs.count }}
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: discover
        shell: bash
        run: |
          count=0
          entries=""

          while IFS= read -r dir; do
            name="$(basename "$dir")"
            if [[ -n "$entries" ]]; then
              entries="${entries},"
            fi
            entries="${entries}{\"name\":\"${name}\",\"dir\":\"${dir}\"}"
            count=$((count + 1))
          done < <(find agents -mindepth 1 -maxdepth 1 -type d -name 'entire-agent-*' | sort)

          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "matrix={\"include\":[${entries}]}" >> "$GITHUB_OUTPUT"

  test-agents:
    name: test-agents (${{ matrix.name }})
    needs: discover-agents
    if: ${{ needs.discover-agents.outputs.count != '0' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-agents.outputs.matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4

      - name: Unit tests
        run: mise run test "${{ matrix.dir }}"

      - name: Build
        run: mise run build "${{ matrix.dir }}"

  # Native Windows coverage for the session-path hardening and reported
  # portability regressions. Full module suites continue to run above on Linux.
  test-windows-paths:
    name: test-windows-paths (${{ matrix.agent }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        agent: [amp, kiro, kilo, grok, qwen]
    defaults:
      run:
        working-directory: agents/entire-agent-${{ matrix.agent }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: agents/entire-agent-${{ matrix.agent }}/go.mod
          cache-dependency-path: agents/entire-agent-${{ matrix.agent }}/go.sum

      - name: Path security and portability regressions
        run: >-
          go test ./internal/${{ matrix.agent }} -count=1 -v
          -run '^(TestSessionFilenamesHashWindowsDevices|TestResolveSessionFile.*|TestSafePathSessionID.*|TestSafeFilename.*|TestResolverMatchesHookTranscript|TestGetSessionDir.*|TestSessionFileResolversContainUnsafeSessionIDs|TestParseHookContainsUnsafeSessionIDInSessionRef|TestParseHookUsesSafeFilenameForSidecarAndMarker|TestWriteSessionWithResolvedUnsafeIDStaysWithinSessionDir|TestEmptySessionIDPathsAgree|TestEncodeRepoCWD|TestNativeTranscriptPath|TestTranscriptAnalysisAndCompactTranscript|TestParseHookStopPrefersSQLiteTranscript|TestInstallHooksRefusesSymlinkWithoutForce|TestInstallHooksForceRepairsPermissionsForIdenticalContent)$'

      - name: Build
        run: go build ./...

  # kimi-code cannot join the matrix above: its internal package is named
  # kimi, not kimi-code, and the module has no go.sum for cache-dependency-path.
  test-windows-paths-kimi-code:
    name: test-windows-paths (kimi-code)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agents/entire-agent-kimi-code
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: agents/entire-agent-kimi-code/go.mod

      - name: Path security and portability regressions
        run: >-
          go test ./internal/kimi -count=1 -v
          -run '^(TestSessionIDsAndResumeCommand|TestGetSessionDirAndResolveAgreement|TestSessionIndexMalformedAndMultipleRecords|TestSessionIndexRejectsEscapingSessionDir|TestSessionIndexSkipsInvalidRecordsForSameID|TestNonCanonicalRepoPathResolves|TestManagedPathConfinement|TestReadSessionRestorationAndFallback|TestRejectForeignSessionAndPathEscapes|TestChildTranscriptsConfinedAndSkipsNonJSONL|TestRecordsParseCRLFAndSkipMalformedLines|TestInstallReinstallPreservesConfigSecurityAndUnrelatedBytes|TestDescriptorCopyFailureLeavesConfigUntouched)$'

      - name: Build
        run: go build ./...
