name: Kimi Code release

on:
  push:
    tags: ['agents/entire-agent-kimi-code/v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/agents/entire-agent-kimi-code/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.27.3'
          cache: false

      - name: Unit tests and vet
        working-directory: agents/entire-agent-kimi-code
        run: |
          go test -count=1 ./...
          go vet ./...

      - name: Resolve semantic version from the nested module tag
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME##*/}" >> "$GITHUB_OUTPUT"
          git tag "${GITHUB_REF_NAME##*/}" "$GITHUB_SHA"

      - name: Build release packages with GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        env:
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.version }}
        with:
          distribution: goreleaser
          version: v2.12.7
          args: release --clean --skip=publish --config .goreleaser.kimi-code.yaml

      - name: Verify packages before publication
        run: python agents/entire-agent-kimi-code/scripts/verify-release.py --dist dist --expected-version "${GITHUB_REF_NAME##*/}"

      - name: Publish archives to the nested module tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null; then
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.tar.gz dist/checksums.txt \
              --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
              --title "entire-agent-kimi-code ${GITHUB_REF_NAME##*/}"
          fi

  verify-release:
    name: verify-release (linux amd64)
    needs: release
    if: startsWith(github.ref, 'refs/tags/agents/entire-agent-kimi-code/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.27.3'
          cache: false

      - name: Download release archives and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir "$RUNNER_TEMP/release"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/release" --clobber
          cd "$RUNNER_TEMP/release"
          ls -1
          test -f checksums.txt

      - name: Verify checksums
        run: |
          cd "$RUNNER_TEMP/release"
          sha256sum --check --strict checksums.txt

      - name: Verify host executable from archive
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release"
          archives=(entire-agent-kimi-code*linux*amd64*.tar.gz)
          if [ ! -e "${archives[0]}" ]; then
            echo "No linux amd64 archive matched: entire-agent-kimi-code*linux*amd64*.tar.gz" >&2
            ls -1 >&2
            exit 1
          fi
          mkdir "$RUNNER_TEMP/host-bin"
          tar -xzf "${archives[0]}" -C "$RUNNER_TEMP/host-bin" entire-agent-kimi-code
          go version -m "$RUNNER_TEMP/host-bin/entire-agent-kimi-code" | tee "$RUNNER_TEMP/go-version-m.txt"
          grep -q 'github.com/MooseGooseConsulting/external-agents/agents/entire-agent-kimi-code' \
            "$RUNNER_TEMP/go-version-m.txt"

      - name: Re-verify downloaded release with the packaging verifier
        run: python agents/entire-agent-kimi-code/scripts/verify-release.py --dist "$RUNNER_TEMP/release" --expected-version "${GITHUB_REF_NAME##*/}"
