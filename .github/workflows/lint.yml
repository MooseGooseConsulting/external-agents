name: Lint

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Pin Go to the version the modules declare. "stable" floats, and a
      # newer toolchain emits export data the pinned golangci-lint cannot read.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: e2e/go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

  discover-agents:
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.discover.outputs.count }}
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - id: discover
        shell: bash
        run: |
          count=0
          entries=""

          while IFS= read -r dir; do
            if [[ -n "$entries" ]]; then
              entries="${entries},"
            fi
            entries="${entries}{\"dir\":\"${dir}\"}"
            count=$((count + 1))
          done < <(find agents -mindepth 1 -maxdepth 1 -type d -name 'entire-agent-*' | sort)

          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "matrix={\"include\":[${entries}]}" >> "$GITHUB_OUTPUT"

  lint-agents:
    name: lint-agents (${{ matrix.dir }})
    needs: discover-agents
    if: ${{ needs.discover-agents.outputs.count != '0' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-agents.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Check for Go module
        id: go-module
        shell: bash
        run: |
          if [[ -f "${{ matrix.dir }}/go.mod" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Go lint for non-Go agent ${{ matrix.dir }}"
          fi

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: steps.go-module.outputs.present == 'true'
        with:
          go-version-file: ${{ matrix.dir }}/go.mod

      - name: Run golangci-lint
        if: steps.go-module.outputs.present == 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: "v2.15.0"
          working-directory: ${{ matrix.dir }}

  lint-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: e2e/go.mod

      - name: Run golangci-lint (e2e)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: "v2.15.0"
          working-directory: e2e
